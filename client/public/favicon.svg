<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="64" height="64" rx="14" fill="#08090a" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Subtle Internal Grid Glow -->
  <circle cx="32" cy="32" r="22" fill="rgba(16, 185, 129, 0.08)" />

  <!-- Modern Dynamic "S" Sync Path -->
  <path d="M42 22 C42 16.5, 37.5 14, 31 14 C23 14, 20 18, 20 22 C20 28, 44 26, 44 38 C44 46, 38 49, 31 49 C23 49, 19 45, 19 39" 
        fill="none" 
        stroke="url(#gradEmerald)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
        
  <!-- Sync Accent Dots -->
  <circle cx="43" cy="22" r="2.5" fill="#38bdf8" />
  <circle cx="19" cy="39" r="2.5" fill="#10b981" />
</svg>